services:
  postgres:
    image: postgres:16-alpine
    container_name: matrixcosec-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matrixcosec}
      POSTGRES_USER: ${POSTGRES_USER:-matrixcosec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Host 5433 avoids colliding with a local PostgreSQL already bound to 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - matrixcosec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  matrixcosec_postgres_data:
